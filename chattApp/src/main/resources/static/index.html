<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ログイン画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { display: block; margin: 10px 0; }
    #message { margin-top: 10px; color: red; }
  </style>
</head>
<body>
  <h1>ログイン</h1>

  <input type="text" id="username" placeholder="ユーザー名" />
  <input type="password" id="password" placeholder="パスワード" />
  <button onclick="login()">ログイン</button>

  <p id="message"></p>

  <p>登録がまだの方は <a href="register.html">こちら</a></p>

  <script>
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!username || !password) {
        message.innerText = "ユーザー名とパスワードを入力してください";
        return;
      }

      try {
        const response = await fetch("/api/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok) {
          message.style.color = "green";
          message.innerText = "ログイン成功！ユーザーID：" + result.userId;
        } else {
          message.style.color = "red";
          message.innerText = "ログイン失敗：" + (result.message || "エラーが発生しました");
        }
      } catch (e) {
        message.innerText = "ユーザーが存在しません";
      }
    }
  </script>
</body>
</html>
